# Tag-driven release: verify, build checked binaries, build and push the
# GHCR image, then draft the GitHub release. Nothing is published without the
# maintainer: the release is a draft, and `workflow_dispatch` is a dry run that
# never pushes or releases. See docs/capstone/07-operations.md "Release process".
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# Keep in sync with the Dockerfile's RUSTUP_TOOLCHAIN.
env:
  RUST_TOOLCHAIN: 1.98.1

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      real: ${{ steps.ver.outputs.real }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml and every version site
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate="$(awk '/^\[workspace\.package\]/ {on=1; next} /^\[/ {on=0} on && /^version *=/ {gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit}' Cargo.toml)"
          if [ "$REF_TYPE" = tag ]; then
            tag="${REF_NAME#v}"
            [ "$tag" = "$crate" ] || { echo "::error::tag $REF_NAME does not match Cargo.toml version $crate"; exit 1; }
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry run from $REF_NAME; using Cargo.toml version $crate"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          tools/release.sh --check "$crate"
          tools/release.sh --notes "$crate" > /dev/null
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  binaries:
    needs: verify
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, serve: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, serve: true }
          - { target: aarch64-apple-darwin, os: macos-latest, serve: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, serve: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p arda-cli -p arda-server
      - name: Smoke
        run: |
          flag=""
          if [ "${{ matrix.serve }}" = true ]; then flag="--serve"; fi
          tools/smoke-binaries.sh "target/${{ matrix.target }}/release" $flag
      - name: Package and checksum
        run: tools/package-release.sh "${{ needs.verify.outputs.version }}" "${{ matrix.target }}" "target/${{ matrix.target }}/release" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/dicemasterio/arda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dist
      - name: Smoke the amd64 image before anything is pushed
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The smoke world comes from the checked linux binary; the script then
          # builds the placeholder image from the same Dockerfile and exercises it.
          tar -xzf "dist/arda-$VERSION-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/arda-$VERSION-x86_64-unknown-linux-gnu/arda" generate --seed 42 --micro --out "$RUNNER_TEMP/world"
          tools/docker-smoke.sh "$RUNNER_TEMP/world"
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # vX.Y.Z -> X.Y.Z, X.Y, latest; a pre-release (vX.Y.Z-rc.N) only its
          # exact tag. `latest` is automatic for non-prerelease semver tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=arda
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.verify.outputs.real == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Placeholder library only (maintainer decision D1): no `artlib` context.
      - name: Build, and push on a real tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.verify.outputs.real == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image digest
        if: needs.verify.outputs.real == 'true'
        run: |
          {
            echo "### Image"
            echo
            echo "\`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [verify, binaries, image]
    if: needs.verify.outputs.real == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          rm ./*.sha256
          cd ..
          tools/release.sh --notes "$VERSION" > notes.md
          {
            echo
            echo "Image: \`ghcr.io/dicemasterio/arda:$VERSION\` (linux/amd64, linux/arm64; placeholder art library only)."
          } >> notes.md
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --draft $pre --verify-tag \
            --title "Arda $TAG" --notes-file notes.md dist/*
