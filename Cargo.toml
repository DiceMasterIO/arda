[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gentbajko/arda"

[workspace.dependencies]
arda-core = { path = "crates/arda-core", version = "0.1.0" }
arda-gen = { path = "crates/arda-gen", version = "0.1.0" }
arda-render = { path = "crates/arda-render", version = "0.1.0" }
arda = { path = "crates/arda", version = "0.1.0" }
zstd = "0.13"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
blake3 = "1.5"
thiserror = "1.0"
anyhow = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

# code-prefs.md §Q7: clippy -D warnings plus *selected* pedantic lints.
# The whole pedantic group is deliberately not enabled.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"

[profile.release]
codegen-units = 1

# Workspace-level golden-world gate (`06-testing.md`). The root package exists
# only to host it, so it has no library or binary of its own.
[package]
name = "arda-workspace-tests"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "tests/empty_lib.rs"

[dev-dependencies]
arda = { workspace = true }
blake3 = { workspace = true }

[[test]]
name = "golden_world"
path = "tests/golden_world.rs"

[lints]
workspace = true
