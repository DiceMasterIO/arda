[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gentbajko/arda"

[workspace.dependencies]
arda-core = { path = "crates/arda-core", version = "0.4.0" }
arda-gen = { path = "crates/arda-gen", version = "0.4.0" }
arda-render = { path = "crates/arda-render", version = "0.4.0" }
arda = { path = "crates/arda", version = "0.4.0" }
arda-tactical = { path = "crates/arda-tactical", version = "0.4.0" }
arda-ids = { path = "crates/arda-ids", version = "0.4.0" }
arda-npc = { path = "crates/arda-npc", version = "0.4.0" }
arda-scene = { path = "crates/arda-scene", version = "0.4.0" }
arda-refine = { path = "crates/arda-refine", version = "0.4.0" }
arda-ways = { path = "crates/arda-ways", version = "0.4.0" }
arda-fields = { path = "crates/arda-fields", version = "0.4.0" }
arda-town = { path = "crates/arda-town", version = "0.4.0" }
arda-blocks = { path = "crates/arda-blocks", version = "0.4.0" }
arda-names = { path = "crates/arda-names", version = "0.4.0" }
arda-settle = { path = "crates/arda-settle", version = "0.4.0" }
arda-society = { path = "crates/arda-society", version = "0.4.0" }
arda-people = { path = "crates/arda-people", version = "0.4.0" }
arda-midzoom = { path = "crates/arda-midzoom", version = "0.4.0" }
arda-wfc = { path = "crates/arda-wfc", version = "0.4.0" }
ab_glyph = "0.2"
zstd = "0.13"
png = "0.17"
flate2 = "1"
crc32fast = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
blake3 = "1.5"
thiserror = "1.0"
anyhow = "1.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

# code-prefs.md §Q7: clippy -D warnings plus *selected* pedantic lints.
# The whole pedantic group is deliberately not enabled.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"

# Sim code is heavy enough that unoptimised tests dominate CI wall-clock;
# erosion alone is ~8x slower without this.
[profile.test]
opt-level = 2

[profile.release]
codegen-units = 1

# Workspace-level golden-world gate (`06-testing.md`). The root package exists
# only to host it, so it has no library or binary of its own.
[package]
name = "arda-workspace-tests"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "tests/empty_lib.rs"

[dev-dependencies]
arda = { workspace = true }
arda-core = { workspace = true }
arda-midzoom = { workspace = true }
arda-npc = { workspace = true }
arda-people = { workspace = true }
arda-server = { path = "crates/arda-server" }
arda-settle = { workspace = true }
arda-town = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
blake3 = { workspace = true }
http-body-util = "0.1"
png = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "golden_world"
path = "tests/golden_world.rs"

[[test]]
name = "golden_recipes"
path = "tests/golden_recipes.rs"

[[test]]
name = "arid_recipe7"
path = "tests/arid_recipe7.rs"

[[test]]
name = "e2e_village"
path = "tests/e2e_village.rs"

[[test]]
name = "zoom_continuity"
path = "tests/zoom_continuity.rs"

[lints]
workspace = true
